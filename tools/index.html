<!DOCTYPE html>
<html lang="en-AU" data-i18n-title="tools.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta
    name="description"
    content="Browser tools by volo1st for payment-file conversion and guitar practice."
    data-i18n-content="tools.description"
  >
  <meta property="og:type" content="website">
  <meta property="og:title" content="Browser Tools | volo1st">
  <meta property="og:description" content="Browser tools for payment-file conversion and guitar practice.">
  <meta property="og:url" content="https://volo1st.com/tools/">
  <title>Browser Tools | volo1st</title>
  <link rel="canonical" href="https://volo1st.com/tools/">
  <link rel="icon" href="../assets/favicon.svg?v=fd8de8ff0d96" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/site-shell.css?v=19ccbe3b2a7c">
  <link rel="stylesheet" href="../assets/site.css?v=cea4c1783ccb">
</head>
<body>
  <header class="site-header">
    <div class="page-title-row">
      <div class="page-title-group">
        <a class="site-mark" href="../" data-i18n-aria-label="common.siteHome">
          <img src="../assets/favicon.svg?v=fd8de8ff0d96" alt="">
        </a>
        <h1 data-i18n="tools.heading">Browser Tools</h1>
      </div>
      <div class="language-switcher" role="group" data-i18n-aria-label="common.language">
        <button type="button" data-language="en-AU" data-i18n-aria-label="common.useEnglish">EN</button>
        <button type="button" data-language="zh-Hans" data-i18n-aria-label="common.useChinese">中文</button>
      </div>
    </div>
  </header>

  <main class="site-main">
    <section class="tool-grid" aria-label="Available tools" data-i18n-aria-label="tools.listLabel">
      <article class="panel tool-card">
        <h2 data-i18n="tools.converterTitle">CSV to ABA Converter</h2>
        <p data-i18n="tools.converterDescription">Convert the music school's teacher payment CSV file to an ABA file for CBA.</p>
        <div class="tool-actions">
          <a class="button-link" href="./csv2aba-v2/" data-i18n="tools.openConverter">Open converter</a>
        </div>
      </article>

      <article class="panel tool-card" data-domain="guitar">
        <h2 data-i18n="tools.guitarTitle">Guitar Strum Machine</h2>
        <p data-i18n="tools.guitarDescription">Practise chord changes and strumming patterns with a looping guitar track.</p>
        <div class="tool-actions">
          <a class="button-link" href="./guitar-strumming/" data-i18n="tools.openGuitar">Open guitar tool</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <a class="site-footer-home" href="../">
      <img src="../assets/favicon.svg?v=fd8de8ff0d96" alt="">
      <span>volo1st</span>
    </a>
  </footer>
  <script src="../assets/i18n.js?v=21eac2aba329"></script>
</body>
</html>
